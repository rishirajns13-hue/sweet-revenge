# Keeps the free Supabase project awake: free projects pause after a week without activity.
# Calls the public ping() function once a day. The key here is the publishable one (also in
# shared/core.js); it's safe to be public.
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 3 * * *'   # every day, 08:47 in India
  workflow_dispatch:        # "Run workflow" button for a manual check
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        run: |
          curl -sS --fail-with-body --retry 3 --retry-delay 20 -X POST \
            "https://tzksdygcuykycrmwwxrv.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_eMPNQhTIHRUN3X2TugWV0A_wDH9TG71" \
            -H "Content-Type: application/json" -d '{}'
